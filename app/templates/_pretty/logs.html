<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Jensen Agent — Logs</title><meta name="viewport" content="width=device-width, initial-scale=1">
<style>:root{--bg:#0b0f14;--panel:#101826;--text:#e5e7eb;--muted:#94a3b8;--border:#1f2937}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0b0f14,#0f172a);color:var(--text);font-family:ui-sans-serif,system-ui,Segoe UI,Roboto,Inter,Arial}
.wrap{max-width:980px;margin:0 auto;padding:24px}.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
h1{margin:0 0 8px}.muted{color:var(--muted)}pre{background:#0b1324;border:1px solid var(--border);border-radius:10px;padding:12px;overflow:auto;max-height:60vh}
a{color:#60a5fa;text-decoration:none}</style></head>
<body><div class="wrap"><div class="card"><h1>Logs</h1>
<p class="muted">Recent log snapshot from the container (when provided by the backend).</p>
<p><a href="/ui/">← Back</a></p>
<pre>{{ logs | default('No inline logs available on this route. Try /ui/admin if present.') }}</pre>
</div></div></body></html>
